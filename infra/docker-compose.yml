name: velora

# Geliştirme altyapısı (yalnızca arka servisler).
# Uygulama (web + worker) geliştirmede host üzerinde `pnpm dev` ile koşar.
# Üretim için web/worker container'ları docker-compose.prod.yml'de tanımlanır.

services:
  postgres:
    image: postgres:15-alpine
    container_name: velora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: velora
      POSTGRES_PASSWORD: velora
      POSTGRES_DB: velora
    ports:
      # Host 5434 -> container 5432 (5432 yerel PG, 5433 başka proje tarafından dolu)
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velora -d velora"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: velora-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: velora-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: velora
      MINIO_ROOT_PASSWORD: velorasecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Başlangıçta asset bucket'ını otomatik oluşturur
  minio-init:
    image: minio/mc:latest
    container_name: velora-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 velora velorasecret) do echo 'minio bekleniyor...'; sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/velora-assets;
      /usr/bin/mc anonymous set download local/velora-assets;
      echo 'bucket hazir';
      exit 0;
      "

  n8n:
    image: n8nio/n8n:latest
    container_name: velora-n8n
    restart: unless-stopped
    environment:
      N8N_PORT: 5678
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Europe/Istanbul
      N8N_RUNNERS_ENABLED: "true"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

  mailhog:
    image: mailhog/mailhog:latest
    container_name: velora-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  n8n_data:
